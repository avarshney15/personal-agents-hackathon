<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What the agent did</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 16px 32px; background: #f5f4f0; color: #111214; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; gap: 16px;">
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <h1 style="margin: 0; font-size: 32px; line-height: 1.12; font-weight: 750; letter-spacing: -0.025em;">What the agent did</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #6b6e76;">Every action, on which site, and how it went. Tap one to see each step.</p>
  </div>

  <div style="background: #ffffff; border-radius: 18px; padding: 14px 16px; border: 1px solid #e6e4de; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <span style="font-size: 15px; font-weight: 650;">Today&#8217;s limit</span>
      <span style="font-size: 14px; color: #6b6e76;">$0.42 of $2.00</span>
    </div>
    <div style="height: 6px; border-radius: 999px; background: #ecebe6;"><div style="width: 21%; height: 6px; border-radius: 999px; background: #111214;"></div></div>
    <span style="font-size: 13px; color: #6b6e76;">The agent stops and asks before going over.</span>
  </div>

  <div style="background: #ffffff; border-radius: 18px; padding: 0 16px; border: 1px solid #e6e4de; display: flex; flex-direction: column;">
    <sc-for list="{{runs}}" as="r" hint-placeholder-count="5">
      <div style="display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #e6e4de;">
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
          <span style="font-size: 15px; font-weight: 650;">{{r.what}}</span>
          <span style="font-size: 13px; color: #6b6e76;">{{r.when}}</span>
        </div>
        <span style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: {{r.bg}}; color: {{r.fg}}; flex-shrink: 0;">{{r.result}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = { bg: '#e1f3e8', fg: '#1f7a46' };
    const wait = { bg: '#fcefd5', fg: '#8f5300' };
    const needs = { bg: '#ffecd8', fg: '#c2410c' };
    return {
      runs: [
        Object.assign({ what: 'RSVP · Agent builders night', when: 'Luma · 2:14 pm · 5 steps', result: 'Going' }, ok),
        Object.assign({ what: 'Asked you for a code', when: 'Luma · 2:12 pm', result: 'Answered' }, needs),
        Object.assign({ what: 'Joined waitlist · Bouldering social', when: 'Meetup · 11:40 am · 4 steps', result: 'Waitlist' }, wait),
        Object.assign({ what: 'Read your events', when: 'Luma, Partiful · 9:00 am', result: '17 events' }, ok),
        Object.assign({ what: 'Read host updates', when: 'Luma · 9:01 am', result: '2 new' }, ok)
      ]
    };
  }
}
</script>
</body>
</html>

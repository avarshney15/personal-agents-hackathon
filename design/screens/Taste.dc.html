<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Into right now</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 16px 32px; background: #f5f4f0; color: #111214; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; gap: 18px;">
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <h1 style="margin: 0; font-size: 32px; line-height: 1.12; font-weight: 750; letter-spacing: -0.025em;">What are you into right now?</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #6b6e76;">Say it your way. The agent remembers it, and you can change or forget it any time.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <label for="into" style="font-size: 13px; font-weight: 650; color: #6b6e76;">In your words</label>
    <textarea id="into" rows="3" style="border-radius: 14px; border: 1px solid #e6e4de; background: #ffffff; padding: 14px 16px; font: inherit; font-size: 16px; line-height: 1.45; color: #111214; resize: none;">Climbing and AI agents lately. Not big networking mixers.</textarea>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 13px; font-weight: 650; color: #6b6e76;">Or tap a few</span>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="10">
        <button type="button" onClick="{{c.toggle}}" aria-pressed="{{c.on}}" style="height: 34px; padding: 0 14px; border-radius: 999px; border: 0; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 14px; font-weight: 650;">{{c.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 13px; font-weight: 650; color: #6b6e76;">When you usually go</span>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <span style="height: 34px; padding: 0 14px; border-radius: 999px; background: #111214; color: #ffffff; font-size: 14px; font-weight: 650; display: flex; align-items: center;">Weekday evenings</span>
      <span style="height: 34px; padding: 0 14px; border-radius: 999px; background: #ecebe6; color: #111214; font-size: 14px; font-weight: 650; display: flex; align-items: center;">Weekend days</span>
      <span style="height: 34px; padding: 0 14px; border-radius: 999px; background: #ecebe6; color: #111214; font-size: 14px; font-weight: 650; display: flex; align-items: center;">Mornings</span>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>
  <a href="Week.dc.html" style="height: 52px; border-radius: 999px; background: #111214; color: #ffffff; font-size: 16px; font-weight: 650; display: flex; align-items: center; justify-content: center; text-decoration: none;">Show my week</a>
  <span style="font-size: 13px; color: #6b6e76; text-align: center;">It also learns from what you go to and skip.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: { 'AI agents': true, 'Climbing': true, 'Hackathons': true } }; }
  renderVals() {
    const labels = ['AI agents', 'Climbing', 'Hackathons', 'Design', 'Music', 'Founders', 'Running', 'Film', 'Food', 'Science talks'];
    return {
      chips: labels.map((l) => {
        const on = !!this.state.on[l];
        return { label: l, on: on ? 'true' : 'false', bg: on ? '#111214' : '#ecebe6', fg: on ? '#ffffff' : '#111214',
          toggle: () => this.setState({ on: Object.assign({}, this.state.on, { [l]: !on }) }) };
      })
    };
  }
}
</script>
</body>
</html>

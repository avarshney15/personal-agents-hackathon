<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>You're going</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 120px 16px 32px; background: #f5f4f0; color: #111214; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; gap: 20px; align-items: stretch;">
  <div style="width: 96px; height: 96px; border-radius: 999px; background: #1f7a46; align-self: center; display: flex; align-items: center; justify-content: center;">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px; text-align: center;">
    <h1 style="margin: 0; font-size: 32px; line-height: 1.12; font-weight: 750; letter-spacing: -0.025em;">You&#8217;re going</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #6b6e76;">Agent builders night · Tuesday 6:30 pm</p>
  </div>

  <div style="background: #ffffff; border-radius: 18px; padding: 4px 16px; border: 1px solid #e6e4de; display: flex; flex-direction: column;">
    <sc-for list="{{checks}}" as="c" hint-placeholder-count="4">
      <div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid #e6e4de;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1f7a46" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><path d="M5 12l5 5 9-10"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 15px; font-weight: 650;">{{c.title}}</span>
          <span style="font-size: 13px; line-height: 1.4; color: #6b6e76;">{{c.detail}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1;"></div>
  <a href="Week.dc.html" style="height: 52px; border-radius: 999px; background: #111214; color: #ffffff; font-size: 16px; font-weight: 650; display: flex; align-items: center; justify-content: center; text-decoration: none;">Back to my week</a>
  <a href="Activity.dc.html" style="font-size: 14px; font-weight: 600; color: #111214; text-align: center;">See what the agent did</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      checks: [
        { title: 'Registered on Luma', detail: 'Luma shows you as going. Ticket in your email.' },
        { title: 'Host told who registered you', detail: 'An agent, for a verified person.' },
        { title: 'Added to your calendar', detail: 'Moved “Call with Sam”? That’s yours to decide.' },
        { title: 'Remembered', detail: 'One more hands-on agent event you chose.' }
      ]
    };
  }
}
</script>
</body>
</html>

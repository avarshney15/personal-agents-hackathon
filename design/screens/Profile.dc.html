<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 16px 0; background: #f5f4f0; color: #111214; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden;">
  <div style="display: flex; gap: 14px; align-items: center;">
    <div style="width: 56px; height: 56px; border-radius: 999px; background: hsl(20,60%,88%); color: hsl(20,45%,24%); font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center;">MR</div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <h1 style="margin: 0; font-size: 22px; line-height: 1.2; font-weight: 700; letter-spacing: -0.015em;">Maya R.</h1>
      <span style="align-self: flex-start; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #e1f3e8; color: #1f7a46;">Verified person</span>
    </div>
  </div>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
    <div style="background: #ffffff; border-radius: 18px; padding: 0 16px; border: 1px solid #e6e4de; display: flex; flex-direction: column;">
      <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
        <a href="{{r.href}}" style="display: flex; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid #e6e4de; color: #111214; text-decoration: none;">
          <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
            <span style="font-size: 16px; font-weight: 650;">{{r.label}}</span>
            <span style="font-size: 13px; color: #6b6e76;">{{r.value}}</span>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b6e76" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </a>
      </sc-for>
    </div>
  </sc-for>

  <button type="button" style="height: 52px; border-radius: 18px; border: 1px solid #e6e4de; background: #ffffff; color: #c62828; font: inherit; font-size: 16px; font-weight: 650; text-align: left; padding: 0 16px;">Delete my account</button>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; height: 64px; border-radius: 999px; background: #ffffff; box-shadow: 0 1px 2px rgba(17,18,20,.04), 0 10px 30px rgba(17,18,20,.08); display: flex; align-items: center; justify-content: space-around; font-size: 12px; font-weight: 650;">
    <a href="Week.dc.html" style="color: #6b6e76; text-decoration: none;">Week</a>
    <a href="Discover.dc.html" style="color: #6b6e76; text-decoration: none;">Discover</a>
    <a href="Connect.dc.html" style="color: #6b6e76; text-decoration: none;">Sites</a>
    <a href="Profile.dc.html" style="color: #111214; text-decoration: none;">Profile</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      groups: [
        { rows: [
          { label: 'Identity', value: 'Verified with Persona · Nov 20', href: 'Verify.dc.html' },
          { label: 'What the agent remembers', value: '5 things · forget any', href: 'Memory.dc.html' }
        ]},
        { rows: [
          { label: 'What the agent did', value: 'Every action and its steps', href: 'Activity.dc.html' },
          { label: 'Spending limit', value: '$2.00 a day', href: 'Activity.dc.html' },
          { label: 'Ask before RSVPing', value: 'Only for paid events', href: 'Profile.dc.html' }
        ]},
        { rows: [
          { label: 'Sites and calendar', value: 'Luma, Partiful, Google Calendar', href: 'Connect.dc.html' }
        ]}
      ]
    };
  }
}
</script>
</body>
</html>

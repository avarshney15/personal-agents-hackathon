<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My week</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 16px 0; background: #f5f4f0; color: #111214; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden;">
  <div style="display: flex; align-items: center; justify-content: space-between;">
    <h1 style="margin: 0; font-size: 32px; line-height: 1.12; font-weight: 750; letter-spacing: -0.025em;">Your week</h1>
    <a href="Ask.dc.html" aria-label="Ask" style="width: 40px; height: 40px; border-radius: 999px; background: #ffffff; box-shadow: 0 1px 2px rgba(17,18,20,.04), 0 10px 30px rgba(17,18,20,.08); display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111214" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
    </a>
  </div>

  <div style="background: #fcefd5; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;">
    <span style="font-size: 15px; font-weight: 700; color: #8f5300;">Tuesday clashes with your calendar</span>
    <span style="font-size: 14px; line-height: 1.45; color: #111214;">Agent builders night starts at 6:30, and you have &#8220;Call with Sam&#8221; from 6:00 to 7:00.</span>
  </div>

  <sc-for list="{{days}}" as="d" hint-placeholder-count="3">
    <div style="display: flex; flex-direction: column;">
      <div style="display: flex; gap: 6px; align-items: baseline; padding-top: 6px;">
        <span style="font-size: 17px; font-weight: 700; letter-spacing: -0.01em;">{{d.date}}</span>
        <span style="font-size: 17px; font-weight: 500; color: #6b6e76;">{{d.wd}}</span>
      </div>
      <sc-for list="{{d.events}}" as="e" hint-placeholder-count="1">
        <a href="Event.dc.html" style="display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #e6e4de; color: #111214; text-decoration: none;">
          <div style="position: relative; width: 64px; height: 64px; flex-shrink: 0;">
            <div style="width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, {{e.c1}}, {{e.c2}}); color: #ffffff; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center;">{{e.ini}}</div>
            <span style="position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); white-space: nowrap; font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 999px; background: {{e.bg}}; color: {{e.fg}}; box-shadow: 0 0 0 2px #f5f4f0;">{{e.status}}</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
            <span style="font-size: 16.5px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.25;">{{e.title}}</span>
            <span style="font-size: 14px; color: #6b6e76;">{{e.meta}}</span>
          </div>
        </a>
      </sc-for>
    </div>
  </sc-for>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; height: 64px; border-radius: 999px; background: #ffffff; box-shadow: 0 1px 2px rgba(17,18,20,.04), 0 10px 30px rgba(17,18,20,.08); display: flex; align-items: center; justify-content: space-around; font-size: 12px; font-weight: 650;">
    <a href="Week.dc.html" style="color: #111214; text-decoration: none;">Week</a>
    <a href="Discover.dc.html" style="color: #6b6e76; text-decoration: none;">Discover</a>
    <a href="Connect.dc.html" style="color: #6b6e76; text-decoration: none;">Sites</a>
    <a href="Profile.dc.html" style="color: #6b6e76; text-decoration: none;">Profile</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const going = { status: 'Going', bg: '#e1f3e8', fg: '#1f7a46' };
    const wait = { status: 'Waitlist', bg: '#fcefd5', fg: '#8f5300' };
    const inv = { status: 'Invited', bg: '#dcf1ee', fg: '#0f6f66' };
    const pend = { status: 'Pending', bg: '#e2ebfb', fg: '#2a5cb3' };
    return {
      days: [
        { date: 'Today', wd: 'Friday', events: [
          Object.assign({ ini: 'PA', c1: 'hsl(330,72%,62%)', c2: 'hsl(10,66%,44%)', title: 'Personal Agents Hack', meta: '9:30 am · SoMa · Luma' }, going)
        ]},
        { date: 'Nov 24', wd: 'Tuesday', events: [
          Object.assign({ ini: 'AB', c1: 'hsl(150,72%,62%)', c2: 'hsl(190,66%,44%)', title: 'Agent builders night', meta: '6:30 pm · SoMa · Luma' }, pend),
          Object.assign({ ini: 'DD', c1: 'hsl(40,72%,62%)', c2: 'hsl(80,66%,44%)', title: 'Design systems dinner', meta: '8:00 pm · Hayes Valley · Partiful' }, inv)
        ]},
        { date: 'Nov 26', wd: 'Thursday', events: [
          Object.assign({ ini: 'BC', c1: 'hsl(30,72%,62%)', c2: 'hsl(70,66%,44%)', title: 'Bouldering social', meta: '7:00 pm · Dogpatch · Meetup' }, wait)
        ]}
      ]
    };
  }
}
</script>
</body>
</html>

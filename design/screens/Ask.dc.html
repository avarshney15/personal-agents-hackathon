<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ask</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 16px 0; background: #f5f4f0; color: #111214; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden;">
  <div style="display: flex; align-items: center; gap: 10px;">
    <a href="Week.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 999px; background: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(17,18,20,.04), 0 10px 30px rgba(17,18,20,.08);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111214" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 22px; line-height: 1.2; font-weight: 700; letter-spacing: -0.015em;">Ask</h1>
  </div>

  <div style="align-self: flex-end; max-width: 280px; background: #111214; color: #ffffff; border-radius: 18px 18px 4px 18px; padding: 10px 14px; font-size: 15px; line-height: 1.45;">Agent hackathons next week, evenings or weekend, not too big</div>

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <span style="font-size: 15px; line-height: 1.45;">Three fit. I left out two that are over 300 people, since you said not too big.</span>
    <span style="font-size: 13px; color: #6b6e76;">Next week · evenings and weekend · under 300</span>
  </div>

  <sc-for list="{{results}}" as="r" hint-placeholder-count="3">
    <a href="Event.dc.html" style="background: #ffffff; border-radius: 18px; padding: 14px 16px; border: 1px solid #e6e4de; display: flex; flex-direction: column; gap: 4px; color: #111214; text-decoration: none;">
      <div style="display: flex; justify-content: space-between; gap: 8px; align-items: center;">
        <span style="font-size: 16.5px; font-weight: 650; letter-spacing: -0.01em;">{{r.title}}</span>
        <span style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: {{r.bg}}; color: {{r.fg}}; flex-shrink: 0;">{{r.tag}}</span>
      </div>
      <span style="font-size: 14px; color: #6b6e76;">{{r.meta}}</span>
      <span style="font-size: 13px; line-height: 1.45;">{{r.why}}</span>
    </a>
  </sc-for>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; gap: 8px; align-items: center;">
    <label for="ask" style="position: absolute; left: -9999px;">Ask the agent</label>
    <input id="ask" type="text" placeholder="Ask for anything" style="flex-grow: 1; height: 52px; border-radius: 999px; border: 1px solid #e6e4de; background: #ffffff; padding: 0 18px; font: inherit; font-size: 16px; color: #111214; box-shadow: 0 1px 2px rgba(17,18,20,.04), 0 10px 30px rgba(17,18,20,.08);">
    <button type="button" aria-label="Send" style="width: 52px; height: 52px; border-radius: 999px; border: 0; background: #111214; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const strong = { tag: 'Strong match', bg: '#e1f3e8', fg: '#1f7a46' };
    const match = { tag: 'Match', bg: '#ecebe6', fg: '#111214' };
    return {
      results: [
        Object.assign({ title: 'Browser agents build night', meta: 'Wed 6:00 pm · Mission · 80 going', why: 'Hands-on, small, and the host ran the last one you went to.' }, strong),
        Object.assign({ title: 'Weekend agent sprint', meta: 'Sat 10:00 am · SoMa · 150 going', why: 'Teams of 2 to 4, like the hackathons you’ve gone to.' }, strong),
        Object.assign({ title: 'Voice agents hack evening', meta: 'Thu 5:30 pm · FiDi · 120 going', why: 'Clashes with Bouldering social, where you’re on the waitlist.' }, match)
      ]
    };
  }
}
</script>
</body>
</html>

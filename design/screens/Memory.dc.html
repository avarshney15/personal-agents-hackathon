<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What the agent remembers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 16px 32px; background: #f5f4f0; color: #111214; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; gap: 16px;">
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <h1 style="margin: 0; font-size: 32px; line-height: 1.12; font-weight: 750; letter-spacing: -0.025em;">What the agent remembers</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #6b6e76;">It uses these to pick events and explain why. Forget anything and it stops counting at once.</p>
  </div>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 13px; font-weight: 650; color: #6b6e76;">{{g.name}}</span>
      <div style="background: #ffffff; border-radius: 18px; padding: 4px 16px; border: 1px solid #e6e4de; display: flex; flex-direction: column;">
        <sc-for list="{{g.items}}" as="i" hint-placeholder-count="2">
          <div style="display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #e6e4de;">
            <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
              <span style="font-size: 15px; font-weight: 650; line-height: 1.3;">{{i.fact}}</span>
              <span style="font-size: 13px; color: #6b6e76;">{{i.from}}</span>
            </div>
            <button type="button" style="height: 34px; padding: 0 14px; border-radius: 999px; border: 0; background: #ecebe6; color: #111214; font: inherit; font-size: 14px; font-weight: 650; flex-shrink: 0;">Forget</button>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>

  <div style="flex-grow: 1;"></div>
  <button type="button" style="height: 52px; border-radius: 999px; border: 0; background: #ffffff; color: #c62828; font: inherit; font-size: 16px; font-weight: 650; box-shadow: 0 1px 2px rgba(17,18,20,.04), 0 10px 30px rgba(17,18,20,.08);">Forget everything</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      groups: [
        { name: 'You said', items: [
          { fact: 'Into climbing and AI agents lately', from: 'You told the agent, Nov 18' },
          { fact: 'Weekend afternoons stay free', from: 'You told the agent, Oct 2' }
        ]},
        { name: 'You went', items: [
          { fact: 'Likes hands-on hackathons over talks', from: '3 hackathons went, 2 talks skipped' },
          { fact: 'Follows hosts from Agent Builders SF', from: 'Went to their last two events' }
        ]},
        { name: 'You skipped', items: [
          { fact: 'Not into sales and pitch nights', from: 'Hid 4 of them' }
        ]}
      ]
    };
  }
}
</script>
</body>
</html>

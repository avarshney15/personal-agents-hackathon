<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>For you</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 16px 0; background: #f5f4f0; color: #111214; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden;">
  <h1 style="margin: 0; font-size: 32px; line-height: 1.12; font-weight: 750; letter-spacing: -0.025em;">For you</h1>

  <div style="background: #ffffff; border-radius: 18px; padding: 12px 14px; border: 1px solid #e6e4de; display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 13px; color: #6b6e76;">Into right now</span>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <span style="height: 34px; padding: 0 14px; border-radius: 999px; background: #111214; color: #ffffff; font-size: 14px; font-weight: 650; display: flex; align-items: center;">Climbing</span>
      <span style="height: 34px; padding: 0 14px; border-radius: 999px; background: #111214; color: #ffffff; font-size: 14px; font-weight: 650; display: flex; align-items: center;">AI agents</span>
      <span style="height: 34px; padding: 0 14px; border-radius: 999px; background: #ecebe6; color: #111214; font-size: 14px; font-weight: 650; display: flex; align-items: center;">Add</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column;">
    <sc-for list="{{events}}" as="e" hint-placeholder-count="4">
      <div style="display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #e6e4de;">
        <div style="width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, {{e.c1}}, {{e.c2}}); color: #ffffff; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">{{e.ini}}</div>
        <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
          <div style="display: flex; gap: 6px; align-items: center;">
            <span style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: {{e.tagBg}}; color: {{e.tagFg}};">{{e.tag}}</span>
          </div>
          <span style="font-size: 16.5px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.25;">{{e.title}}</span>
          <span style="font-size: 14px; color: #6b6e76;">{{e.meta}}</span>
          <span style="font-size: 13px; line-height: 1.45; color: #111214;">{{e.why}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <span style="font-size: 13px; line-height: 1.45; color: #6b6e76;">Ranked by what you&#8217;ve been to and skipped. You&#8217;re in the new ranking this week.</span>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; height: 64px; border-radius: 999px; background: #ffffff; box-shadow: 0 1px 2px rgba(17,18,20,.04), 0 10px 30px rgba(17,18,20,.08); display: flex; align-items: center; justify-content: space-around; font-size: 12px; font-weight: 650; color: #6b6e76;">
    <span>Week</span><span style="color: #111214;">Discover</span><span>People</span><span>Sites</span><span>Profile</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const strong = { tag: 'Strong match', tagBg: '#e1f3e8', tagFg: '#1f7a46' };
    const fresh = { tag: 'Something new', tagBg: '#ecebe6', tagFg: '#111214' };
    return {
      events: [
        Object.assign({ ini: 'AB', c1: 'hsl(150,72%,62%)', c2: 'hsl(190,66%,44%)', title: 'Agent builders night', meta: 'Tue 6:30 pm · SoMa', why: 'You went to 3 agent hackathons this autumn, and liked the hands-on ones.' }, strong),
        Object.assign({ ini: 'BC', c1: 'hsl(30,72%,62%)', c2: 'hsl(70,66%,44%)', title: 'Bouldering social', meta: 'Thu 7:00 pm · Dogpatch', why: 'You said climbing lately. Same gym as the one you went to in October.' }, strong),
        Object.assign({ ini: 'EV', c1: 'hsl(330,72%,62%)', c2: 'hsl(10,66%,44%)', title: 'Evals for agents, a workshop', meta: 'Sat 10:00 am · Mission', why: 'Hosted by someone whose last two events you went to.' }, strong),
        Object.assign({ ini: 'CF', c1: 'hsl(100,72%,62%)', c2: 'hsl(140,66%,44%)', title: 'Ceramics for beginners', meta: 'Sun 2:00 pm · Inner Sunset', why: 'Something new: a weekend afternoon, which you keep free.' }, fresh)
      ]
    };
  }
}
</script>
</body>
</html>
